services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qwe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwe}
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_CONN_URL: ${POSTGRES_CONN_URL:-postgres://qwe:qwe@db:5432/booking_db?sslmode=disable}
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=${POSTGRES_CONN_URL}"
      - "up"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs/config.yaml}
      POSTGRES_CONN_URL: ${POSTGRES_CONN_URL:-postgres://qwe:qwe@db:5432/booking_db?sslmode=disable}
    ports:
      - "8080:8080"
    stop_grace_period: 15s
    restart: "no"

volumes:
  pgdata: